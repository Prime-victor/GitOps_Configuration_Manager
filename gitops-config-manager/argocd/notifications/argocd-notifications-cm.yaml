apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd

data:

  # ── Discord Service Definition  ──────────────────────────
  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
      - name: Content-Type
        value: application/json

  # ── Notification Templates ─────────────────────────────────────────────────

  template.discord-sync-failed: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "avatar_url": "https://argo-cd.readthedocs.io/en/stable/assets/logo.png",
            "embeds": [
              {
                "title": " Sync Failed: {{.app.metadata.name}}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Environment",
                    "value": "{{index .app.metadata.labels "environment"}}",
                    "inline": true
                  },
                  {
                    "name": "Status",
                    "value": "{{.app.status.sync.status}}",
                    "inline": true
                  },
                  {
                    "name": "Revision",
                    "value": "`{{.app.status.sync.revision | substr 0 7}}`",
                    "inline": true
                  },
                  {
                    "name": "Error",
                    "value": "```{{.app.status.operationState.message}}```",
                    "inline": false
                  }
                ],
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "timestamp": "{{.app.status.operationState.finishedAt}}"
              }
            ]
          }

  template.discord-health-degraded: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "embeds": [
              {
                "title": "🔴 Health Degraded: {{.app.metadata.name}}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Environment",
                    "value": "{{index .app.metadata.labels "environment"}}",
                    "inline": true
                  },
                  {
                    "name": "Health Status",
                    "value": "{{.app.status.health.status}}",
                    "inline": true
                  },
                  {
                    "name": "Message",
                    "value": "{{.app.status.health.message}}",
                    "inline": false
                  }
                ],
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ]
          }

  # ── Trigger Definitions ────────────────────────────────────────────────────

  trigger.on-sync-failed: |
    - description: Notify when application sync fails
      when: app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.syncResult.revision
      send:
        - discord-sync-failed

  trigger.on-health-degraded: |
    - description: Notify when application health degrades
      when: >-
        app.status.health.status == 'Degraded' and
        app.status.operationState != nil and
        app.status.operationState.phase not in ['Running']
      oncePer: app.status.health.status
      send:
        - discord-health-degraded

  template.discord-sync-succeeded: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "embeds": [
              {
                "title": "Sync Succeeded: {{.app.metadata.name}}",
                "color": 3066993,
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ]
          }

  template.discord-sync-running: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "embeds": [
              {
                "title": "Sync Running: {{.app.metadata.name}}",
                "color": 3447003,
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ]
          }

  template.discord-out-of-sync: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "embeds": [
              {
                "title": "OutOfSync: {{.app.metadata.name}}",
                "color": 15105570,
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ]
          }

  template.discord-sync-unknown: |
    webhook:
      discord:
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body: |
          {
            "username": "ArgoCD",
            "embeds": [
              {
                "title": "Sync Unknown: {{.app.metadata.name}}",
                "color": 9807270,
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ]
          }

  trigger.on-sync-succeeded: |
    - description: Notify when application sync succeeds
      when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.sync.revision
      send:
        - discord-sync-succeeded

  trigger.on-sync-running: |
    - description: Notify when application sync is running
      when: app.status.operationState.phase in ['Running']
      send:
        - discord-sync-running

  trigger.on-out-of-sync: |
    - description: Notify when application is out of sync
      when: app.status.sync.status == 'OutOfSync'
      oncePer: app.status.sync.revision
      send:
        - discord-out-of-sync

  trigger.on-sync-status-unknown: |
    - description: Notify when sync status is unknown
      when: app.status.sync.status == 'Unknown'
      oncePer: app.status.sync.status
      send:
        - discord-sync-unknown

  trigger.on-deployed: |
    - description: Notify on deployment completion
      when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.sync.revision
      send:
        - discord-sync-succeeded

  # ── Context Variables ──────────────────────────────────────────────────────

  context: |
    argocdUrl: https://localhost:8080
